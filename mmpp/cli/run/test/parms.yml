swap:
  aex: [10e-12, 15e-12, 20e-12]  # Exchange constant
  # aex: np.linspace(10e-12, 20e-12, 5)  # Linear spacing
  # aex: (10e-12, 20e-12, 5)  # Range syntax
  msat: [800e3]  # Saturation magnetization
  # msat: (800e3, 1200e3, 5)  # Range in A/m

config:
  last_param_name: "msat"     # Parameter for last iteration
  prefix: "v1"                  # Simulation prefix/version
  template_name: "template.mx3"    # Template file name
  
  # Execution modes (choose one)
  sbatch: true                      # Use SLURM batch system locally
  remote_run: false                 # Use remote MMPP server for execution
  
  full_name: false                  # Use full parameter names in paths

  # Execution control
  minsim: 0                          # Minimum simulation index
  maxsim: null                       # Maximum simulation index (null = no limit)
  pairs: false                       # Use paired parameters instead of cartesian product
  cleanup: false                     # Cleanup temporary files
  check: false                       # Check simulation status
  force: false                       # Force re-run completed simulations
