[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmpp"
dynamic = ["version"]
authors = [
    {name = "Mateusz Zelent", email = "mateusz.zelent@amu.edu.pl"}
]
description = "A library for MMPP (Micro Magnetic Post Processing) simulation and analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "matplotlib>=3.11.2",
    # Restore an uncompromised CA bundle for HTTPS clients.
    "certifi>=2026.10.23",
    # Pillow 13 contains upstream security fixes.
    "Pillow>=13.0.0",
    # The package currently uses the Zarr 2 API (including create_dataset(data=...)).
    # Keep one compatible storage dependency across the supported Python versions
    # until the Zarr 3 API migration is complete.
    "zarr>=2.18.7,<3.0.0",
    # Zarr 2.18.x imports codec helpers removed by numcodecs 0.16.
    "numcodecs>=0.15.2,<0.17",
    "h5py>=3.16.0",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "setuptools>=84.2.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "build>=1.6.1",
    "twine>=7.0.0",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-autodoc-typehints>=3.6.1",
    "myst-parser>=5.1.0",
    "linkify-it-py>=2.2.0",
    "IPython>=9.17.1",
    "ipywidgets>=8.1.9",
    "scipy>=1.17.1",
]
interactive = [
    "itables>=2.9.1",
    "IPython>=9.17.1",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.9",
    "k3d>=3.2.0",
    "holoviews>=1.23.2",
    "pyvista>=0.49.1",
]
plotting = [
    "cmocean>=4.0.3",
    "cmcrameri>=1.10",
    "k3d>=3.2.0",
    "holoviews>=1.23.2",
    "pyvista>=0.49.1",
]
fft = [
    "scipy>=1.17.1",
    "pyfftw>=0.15.1",
]
wavelets = [
    "PyWavelets>=1.9.0",
]
image = [
    "scikit-image>=0.26.0",
    "imageio>=2.38.1",
]
ml = [
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
]
tui = [
    "textual>=8.2.8",
]
full = [
    "textual>=8.2.8",
    "cmocean>=4.0.3",
    "cmcrameri>=1.10",
    "k3d>=3.2.0",
    "holoviews>=1.23.2",
    "pyvista>=0.49.1",
    "itables>=2.9.1",
    "IPython>=9.17.1",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.9",
    "scipy>=1.17.1",
    "pyfftw>=0.15.1",
    "PyWavelets>=1.9.0",
    "scikit-image>=0.26.0",
    "imageio>=2.38.1",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "numba>=0.68.0",
    "psutil>=7.2.2",
]

[project.urls]
Homepage = "https://github.com/mateuszzelent/mmpp"
Repository = "https://github.com/mateuszzelent/mmpp"
Issues = "https://github.com/mateuszzelent/mmpp/issues"

[project.scripts]
mmpp = "mmpp.cli:main"
mmpp-tui = "mmpp.tui:main"
mmpp-classic = "mmpp.cli.main:main"

[tool.setuptools]

[tool.setuptools.dynamic]
version = {attr = "mmpp.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mmpp", "mmpp.*"]

[tool.setuptools.package-data]
mmpp = ["paper.mplstyle", "fonts/**/*", "pyzfn/**/*.py", "dracula.tcss"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "B905",  # preserve zip behavior in legacy analysis paths
    "C901",  # too complex
    "UP007", # retain Optional annotations in the public compatibility layer
    "UP045", # retain Optional annotations across the established public API
    "C420",  # preserve explicit parameter dictionaries in legacy exports
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"mmpp/cli/swap/oryginal_swapper.py" = ["E402"]
"mmpp/fft/core.py" = ["E402"]
"mmpp/fft/dispersion/modes/interactive.py" = ["E402"]
"mmpp/fft/modes/__init__.py" = ["E402"]
"mmpp/fft/modes/interactive.py" = ["E402"]
"mmpp/fft/modes/visualization/animation.py" = ["E402"]
"mmpp/fft/modes/visualization/static_plots.py" = ["E402"]
"mmpp/fft/old_modes.py" = ["E402", "F401"]
"mmpp/fft/plot.py" = ["E402"]
"mmpp/fft/transmission/compute.py" = ["E402"]
"mmpp/tests/run_h5_test.py" = ["E402"]
# These are notebook-style example fragments and intentionally rely on names
# defined by the surrounding user workflow.
"tests/REPLACE_YOUR_CODE.py" = ["E402"]
"tests/add_overlay_to_your_code.py" = ["F821"]
"tests/your_code_with_overlay.py" = ["E402", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["mmpp"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
implicit_optional = true
exclude = '(^|/)(old_modes|run_h5_test|test_dispersion_models)\.py$'

# These modules are thin boundaries over Zarr's version-dependent dynamic API.
# Keep the package-root gate useful for the remaining code until stable Zarr
# protocol stubs are available across the supported dependency range.
[[tool.mypy.overrides]]
module = [
    "mmpp._shared.cache",
    "mmpp.analyze.hysteresis.metrics",
    "mmpp.cache.batch",
    "mmpp.cache.decorators",
    "mmpp.cache.serializers",
    "mmpp.cli.swap.simulation",
    "mmpp.core.job",
    "mmpp.fft._compute_cache",
    "mmpp.fft._compute_loading",
    "mmpp.fft.compute_fft",
    "mmpp.fft.core",
    "mmpp.fft.dispersion._interface.cache",
    "mmpp.fft.dispersion.bulk",
    "mmpp.fft.dispersion.interface",
    "mmpp.fft.modes",
    "mmpp.fft.modes.analyzer.data_access",
    "mmpp.fft.modes.models",
    "mmpp.fft.modes.visualization.animation",
    "mmpp.fft.transmission.cache",
    "mmpp.plotting",
    "mmpp.pyzfn.pyzfn",
    "mmpp.simulation",
    "mmpp.solitons.vortex.plotting",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "mmpp/tests",
]
