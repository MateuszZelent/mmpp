[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmpp"
dynamic = ["version"]
authors = [
    {name = "Mateusz Zelent", email = "mateusz.zelent@amu.edu.pl"}
]
description = "A library for MMPP (Micro Magnetic Post Processing) simulation and analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "zarr>=2.18.0,<3.0.0; python_version < '3.11'",
    "zarr>=3.0.0; python_version >= '3.11'",
    "h5py>=3.0.0",
    "rich",
    "tqdm",
    "PyYAML>=5.4.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "build",
    "twine",
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "linkify-it-py",
    "scipy",
]
interactive = [
    "itables",
    "IPython",
    "jupyter",
    "ipywidgets",
    "k3d",
    "holoviews",
    "pyvista",
]
plotting = [
    "cmocean",
    "cmcrameri",
    "k3d",
    "holoviews",
    "pyvista",
]
fft = [
    "scipy",
    "pyfftw",
]
wavelets = [
    "PyWavelets",
]
image = [
    "scikit-image",
    "imageio",
]
ml = [
    "scikit-learn",
    "joblib",
]
tui = [
    "textual>=0.40.0",
]
full = [
    "textual>=0.40.0",
    "cmocean",
    "cmcrameri",
    "k3d",
    "holoviews",
    "pyvista",
    "itables",
    "IPython",
    "jupyter",
    "ipywidgets",
    "scipy",
    "pyfftw",
    "PyWavelets",
    "scikit-image",
    "imageio",
    "scikit-learn",
    "joblib",
    "numba",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/mateuszzelent/mmpp"
Repository = "https://github.com/mateuszzelent/mmpp"
Issues = "https://github.com/mateuszzelent/mmpp/issues"

[project.scripts]
mmpp = "mmpp.cli:main"
mmpp-tui = "mmpp.tui:main"
mmpp-classic = "mmpp.cli.main:main"

[tool.setuptools]

[tool.setuptools.dynamic]
version = {attr = "mmpp.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mmpp", "mmpp.*"]

[tool.setuptools.package-data]
mmpp = ["paper.mplstyle", "fonts/**/*", "pyzfn/**/*.py", "dracula.tcss"]

[tool.ruff]
line-length = 88
target-version = "py310"
# These files are user-editable snippets or compatibility-only modules, not
# package production code. They remain syntax-checked and formatted, while the
# maintained package and real test suite keep the full Ruff rules below.
extend-exclude = [
    "tests/REPLACE_YOUR_CODE.py",
    "tests/add_overlay_to_your_code.py",
    "tests/your_code_with_overlay.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP038", # preserve explicit tuple syntax in dynamic/runtime type checks
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"mmpp/__init__.py" = ["E402"]
"mmpp/cli/swap/oryginal_swapper.py" = ["E402"]
"mmpp/core/dataset.py" = ["E402"]
"mmpp/fft/core.py" = ["E402"]
"mmpp/fft/dispersion/modes/interactive.py" = ["E402"]
"mmpp/fft/modes/__init__.py" = ["E402"]
"mmpp/fft/modes/analyzer/__init__.py" = ["I001"]
"mmpp/fft/modes/interactive.py" = ["E402"]
"mmpp/fft/modes/visualization/animation.py" = ["E402"]
"mmpp/fft/modes/visualization/static_plots.py" = ["E402"]
"mmpp/fft/plot.py" = ["E402"]
"mmpp/fft/transmission/compute.py" = ["E402"]
"mmpp/tests/run_h5_test.py" = ["E402"]
"mmpp/fft/old_modes.py" = ["E402", "F401", "E722", "B904"]
"mmpp/fft/modes/init.py" = ["F401"]
"mmpp/fft/modes/visualization/interactive.py" = ["F401"]
"tests/colorbar_integration.py" = ["F401"]
"tests/example_smart_legend.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["mmpp"]

[tool.mypy]
exclude = '(^|/)(old_modes\.py|test_dispersion_models\.py|run_h5_test\.py)$'
python_version = "3.10"
warn_unused_configs = true
disable_error_code = "unused-ignore"
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
disallow_untyped_defs = false
disallow_any_generics = false
no_implicit_optional = false
strict_equality = false
warn_redundant_casts = false
warn_unreachable = false
no_implicit_reexport = false
disallow_untyped_calls = false
strict = false
plugins = "numpy.typing.mypy_plugin"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "mmpp/tests",
]
