name: FFT Dispersion Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFT dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fft]"

      - name: Run medium benchmark
        run: |
          python scripts/analysis/benchmark_fft_dispersion.py \
            --profile medium-dev \
            --backend numpy \
            --workers 1 \
            --store-complex \
            --no-orthogonal-average \
            --max-elapsed-s 120 \
            --max-peak-memory-mb 2048 \
            --output /tmp/mmpp-dispersion-medium-dev-benchmark.json

      - name: Research profile memory preflight
        run: |
          python scripts/analysis/benchmark_fft_dispersion.py \
            --profile research-reference \
            --preflight-only \
            --store-complex \
            --no-orthogonal-average \
            --max-peak-memory-mb 4096 \
            --output /tmp/mmpp-dispersion-research-reference-preflight.json

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: fft-dispersion-benchmark-reports
          path: |
            /tmp/mmpp-dispersion-medium-dev-benchmark.json
            /tmp/mmpp-dispersion-research-reference-preflight.json
