# Enhanced MMPP Simulation Parameters Example
# Demonstrates all supported syntax options for parameter sweeps

swap:
  # 1. Basic discrete values (traditional syntax)
  Material: [1, 2, 3, 4]  # Different material types
  
  # 2. Range syntax: (min, max, count) - generates linspace
  B0: (0.005, 0.05, 10)  # 10 values from 0.005 to 0.05 Tesla
  
  # 3. NumPy linear spacing
  xsize: np.linspace(100, 600, 6)  # 6 sizes from 100 to 600 nm
  
  # 4. NumPy step-based ranges  
  rotation: np.arange(0, 91, 15)  # Every 15 degrees from 0 to 90
  
  # 5. Logarithmic spacing
  alpha: np.logspace(-3, -1, 5)  # 5 values from 0.001 to 0.1 (log scale)
  
  # 6. Geometric spacing
  frequency: np.geomspace(1e9, 10e9, 5)  # 5 frequencies from 1 to 10 GHz
  
  # 7. Mathematical expressions with functions
  angles: [sin(pi*i/6) for i in range(7)]  # Sine values for angles 0°, 30°, 60°, 90°...
  
  # 8. Power series using list comprehensions
  powers_of_two: [2**i for i in range(1, 6)]  # [2, 4, 8, 16, 32]
  
  # 9. Complex mathematical expressions
  field_strengths: [0.01 * exp(i/5) for i in range(6)]  # Exponential growth
  
  # 10. Mixed operations with numpy arrays
  scaled_values: np.array([1, 2, 3, 4, 5]) * 0.001  # Scale array by factor
  
  # 11. Temperature sweep with physical meaning
  temperature: (200, 400, 11)  # 11 temperatures from 200K to 400K
  
  # 12. Frequency sweep in scientific notation
  rf_frequency: [2.4e9, 5.0e9, 10.0e9, 24.0e9]  # WiFi, 5G bands etc.

config:
  last_param_name: "Material"      # Parameter for final iteration
  prefix: "enhanced_sweep"         # Simulation prefix/version
  template_name: "template.mx3"    # Template file name
  sbatch: true                     # Use SLURM batch system
  full_name: false                 # Use abbreviated parameter names in paths

  # Execution control
  minsim: 0                        # Start from simulation index 0
  maxsim: null                     # Run all combinations (null = no limit)
  pairs: false                     # Use cartesian product (not paired values)
  
  # Additional options
  cleanup: false                   # Keep temporary files
  check: false                     # Don't check existing simulations
  force: false                     # Don't force re-run completed simulations
